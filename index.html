<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yushi Pocket" />
    <meta name="description" content="Virtual iPhone of Tokuno Yushi" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="images/yushi-pocket-192.png" />
    <link rel="icon" href="images/yushi-pocket.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <title>Yushi Pocket</title>
  </head>
  <body>
    <main class="stage" aria-label="Yushi Pocket virtual phone">
      <section class="phone-shell" id="phone" aria-live="polite">
        <div class="phone-speaker" aria-hidden="true"></div>
        <div class="phone-screen">
          <div class="wallpaper" aria-hidden="true"></div>
          <div class="wallpaper-wash" aria-hidden="true"></div>

          <div class="screen lock-screen active" id="lock-screen">
            <div class="status-bar status-light"><span id="lock-time-small">9:41</span><span class="status-icons">▮▮▮　◖◗　▰</span></div>
            <div class="dynamic-island" aria-hidden="true"></div>
            <div class="lock-content">
              <span class="lock-icon" aria-hidden="true">⌁</span>
              <p class="lock-date" id="lock-date">Monday, October 20</p>
              <h1 class="lock-time" id="lock-time">9:41</h1>
              <p class="lock-message">a little universe for yushi</p>
            </div>
            <div class="lock-actions" aria-hidden="true"><span class="quick-action">⌁</span><span class="quick-action">◉</span></div>
            <button class="swipe-pill unlock-trigger" type="button" aria-label="Tap to unlock"><span>Swipe up to unlock</span><b>⌃</b></button>
          </div>

          <div class="screen passcode-screen" id="passcode-screen">
            <div class="status-bar status-light"><span id="passcode-time">9:41</span><span class="status-icons">▮▮▮　◖◗　▰</span></div>
            <button class="back-to-lock" type="button" aria-label="Back to lock screen">‹</button>
            <div class="passcode-content">
              <div class="face-ring">◌</div>
              <h2>Enter Passcode</h2>
              <p id="passcode-help">Enter your passcode</p>
              <div class="passcode-dots" id="passcode-dots" aria-label="Passcode digits"><i></i><i></i><i></i><i></i></div>
              <div class="keypad" aria-label="Passcode keypad">
                <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
                <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
                <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
                <span></span><button type="button" data-key="0">0</button><button type="button" class="delete-key" data-key="delete" aria-label="Delete digit">⌫</button>
              </div>
              <button class="emergency-button" type="button">Emergency</button>
            </div>
          </div>

          <div class="screen home-screen" id="home-screen">
            <div class="status-bar status-light"><span id="home-time">9:41</span><span class="status-icons">▮▮▮　◖◗　▰</span></div>
            <div class="dynamic-island" aria-hidden="true"></div>
            <div class="home-content">
              <p class="home-greeting" id="home-date">Monday, October 20</p>
              <h2>Yushi’s Phone</h2>
              <div class="app-grid" id="app-grid">
                <button class="app-icon kakao" data-app="kakao" type="button"><span class="icon-art">●</span><small>KakaoTalk</small></button>
                <button class="app-icon photos" data-app="photos" type="button"><span class="icon-art">✿</span><small>Photos</small></button>
                <button class="app-icon notes" data-app="notes" type="button"><span class="icon-art">☰</span><small>Notes</small></button>
                <button class="app-icon instagram" data-app="instagram" type="button"><span class="icon-art">◎</span><small>Instagram</small></button>
                <button class="app-icon calendar" data-app="calendar" type="button"><span class="calendar-icon"><b id="cal-day">20</b><em>MON</em></span><small>Calendar</small></button>
                <button class="app-icon safari" data-app="safari" type="button"><span class="icon-art">⌁</span><small>Search</small></button>
                <button class="app-icon settings" data-app="settings" type="button"><span class="icon-art">⚙</span><small>Settings</small></button>
                <button class="app-icon memories" data-app="memories" type="button"><span class="icon-art">♡</span><small>Memories</small></button>
              </div>
            </div>
            <div class="dock" aria-label="Dock"><button class="app-icon dock-phone" data-app="kakao" type="button"><span class="icon-art">⌕</span></button><button class="app-icon dock-message" data-app="kakao" type="button"><span class="icon-art">●</span></button><button class="app-icon dock-camera" data-app="photos" type="button"><span class="icon-art">◉</span></button></div>
            <div class="home-indicator" aria-hidden="true"></div>
          </div>

          <div class="screen app-screen" id="app-screen">
            <div class="app-topbar"><button class="app-close" id="app-close" type="button" aria-label="กลับหน้าหลัก">‹</button><h2 id="app-title">App</h2><span id="app-action"></span></div>
            <article id="app-content" class="app-content"></article>
            <div class="home-indicator dark" aria-hidden="true"></div>
          </div>

          <div class="photo-modal" id="photo-modal" aria-hidden="true"><button id="photo-close" type="button" aria-label="Close photo">×</button><img id="modal-image" src="" alt="Memory" /><p id="modal-caption"></p></div>
        </div>
      </section>
      <p class="desktop-hint">Tap the phone to start · designed for touch</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
